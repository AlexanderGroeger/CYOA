    spacing: 10
    gap_width: 40
    gap_position: 110
    gap_movement: oscillate
    gap_speed: 17
    gap_bounds: [34, 186]
    projectile: {radius: 4, damage: 3, color: [255, 85, 115]}
    difficulty:
      easy: {wall_speed: 35, gap_width: 50, gap_speed: 10}
      hard: {wall_speed: 58, gap_width: 27, gap_speed: 27}

