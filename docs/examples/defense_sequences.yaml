    start: 0.4
    duration: 4.9
    direction: vertical
    lane_count: 5
    warning_duration: 0.52
    active_duration: 0.36
    sequence:
      - {time: 0.0, active_lanes: [0, 2, 4]}
      - {time: 1.0, active_lanes: [1, 3]}
      - {time: 2.0, active_lanes: [0, 1, 4]}
      - {time: 3.0, active_lanes: [2, 3]}
      - {time: 4.0, active_lanes: [0, 2, 4]}
    damage: 3
    telegraph: {flash_rate: 9, alpha: 105}

