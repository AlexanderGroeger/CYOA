# Enemy-defense sequence library
#
# Each YAML document below is one standalone DefenseSequence. Copy one document
# into a battle's defense_sequences collection, then point an enemy move's
# defense_sequence field at its id. All coordinates are local to the arena.

---
id: training_aimed_stream
duration: 5.0
arena: {width: 220, height: 110, player_speed: 120}
patterns:
  - type: aimed_stream
    start: 0.0
    duration: 5.0
    origin: {x: 0.5, y: 0.0, normalized: true}
    fire_interval: 0.52
    targeting: player_position
    projectile: {speed: 58, radius: 3, damage: 2, color: [255, 125, 90]}

---
id: hunter_predictive_steps
duration: 5.4
arena: {width: 220, height: 110, player_speed: 120}
patterns:
  - type: predictive_stream
    start: 0.4
    duration: 4.6
    origin: {x: 0.5, y: 0.0, normalized: true}
    fire_interval: 0.50
    prediction_strength: 0.72
    player_velocity_weight: 0.65
    spread: 8
    projectile: {speed: 76, radius: 3, damage: 2, color: [255, 185, 70]}

---
id: radial_burst_crossing
duration: 4.2
