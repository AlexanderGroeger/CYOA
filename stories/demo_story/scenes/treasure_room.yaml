id: treasure_room
background: treasure.txt
text: |
  Your torchlight catches it before anything else: a gem the size of your
  fist, resting on a bed of old coins, pulsing faintly with its own light.
choices:
  - text: "Take the gem"
    actions:
      - add_item: treasure_gem
      - set_flag: {took_treasure: true}
    goto: ending_good
  - text: "Leave it undisturbed and head home"
    goto: ending_neutral
