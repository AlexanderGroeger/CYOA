id: exploration_hall
background: forest.png
music: overworld.mp3
exploration:
  dialog:
  - sequence: hall_arrival
  navigation:
  - scene: exploration_study
    label: Study
  - scene: exploration_archive
    label: Hidden Archive
    conditions:
      all:
      - flag: archive_route_open
        equals: true
  look_regions:
  - id: archive_door
    rect:
    - 453
    - 63
    - 110
    - 194
    interaction: inspect
    event: inspect_archive_door
    priority: 1
  look_events:
    inspect_archive_door:
      actions:
      - type: dialog
        dialog: archive_door_note
  dialogue_sequences:
    hall_arrival:
    - The hall joins the study to a sealed archive door. Fresh air drifts in from
      the study.
    archive_door_note:
    - The door has no handle on this side. The lamp in the study may be the key.
