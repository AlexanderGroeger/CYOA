id: forest_clearing
background: tree.png
music: overworld.mp3
exploration:
  cursor_speed: 170
  dialog:
  - conditions:
      all:
      - flag: tree_visited
        equals: false
    sequence: first_time
  dialogue_sequences:
    first_time:
    - The forest has opened up and a large tree rests at the edge of a small stream.
    inspect_stream:
    - The stream babbles and shines like silver. The water is refreshing.
    grab_acorn:
    - The tree drops an acorn into your hand. Somehow you know the tree did it on
      purpose.
  navigation:
  - battle: wolf_fight
    label: Confront the wolf
    on_win: cave_entrance
    on_lose: forest_clearing
  - scene: moose_encounter
    label: Moose
  - scene: deer_encounter
    label: Deer
    conditions:
      all:
      - flag: acorn_collected
        equals: true
  objects:
  - id: acorn
    sprite: acorn.png
    position:
    - 490
    - 50
    z: 12
    visible_when:
      all:
      - flag: acorn_collected
        equals: false
  look_regions:
  - id: stream
    rect:
    - 227
    - 306
    - 410
    - 50
    interaction: inspect
    event: inspect_stream
    priority: 2
  - id: acorn_interaction
    rect:
    - 482
    - 42
    - 48
    - 51
    interaction: action
    event: acorn_interaction_event
    visible_when:
      all:
      - flag: acorn_collected
        equals: false
  look_events:
    inspect_stream:
      actions:
      - type: dialog
        dialog: inspect_stream
    grab_acorn:
      actions:
      - type: dialog
        dialog: grab_acorn
      - type: sound
        file: got_item.wav
      - type: give_item
        item: acorn
        quantity: 1
      - type: set_flag
        flag: acorn_collected
        value: true
    acorn_interaction_event:
      actions:
      - type: move_object
        target: acorn
        position:
        - 800
        - 481
        duration: 1.0
      - type: dialog
        dialog: grab_acorn
        text: ''
      - type: set_flag
        flag: acorn_collected
        value: true
      - type: sound
        file: got_item.wav
      - type: give_item
        item: acorn
        quantity: 1
